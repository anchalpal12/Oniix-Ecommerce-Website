name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Run backend tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
          MONGODB_URI: mongodb://127.0.0.1:27017/onix-ci-test

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build client
        run: npm run build --prefix client

      - name: Lint client
        run: npm run lint --prefix client

      - name: Seed products for E2E
        run: npm run seed-products
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/onix-ci-test

      - name: Install Playwright Chromium
        run: cd client && npx playwright install --with-deps chromium

      - name: Run client E2E smoke test
        run: npm run test:e2e --prefix client
        env:
          CI: true
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
          MONGODB_URI: mongodb://127.0.0.1:27017/onix-ci-test
