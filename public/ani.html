<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .image2-container {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  background-color: #000;
  color: white;
  padding: 30px;
  gap: 20px;
}

.image-left img {
  width: 100%;
  max-width: 400px;
  border-radius: 10px;
}

.text-right {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: slideIn 1s ease-out;
}

.text-content {
  max-width: 400px;
}

.text-content h2 {
  font-size: 32px;
  margin-bottom: 10px;
}

.text-content h4 {
  font-size: 24px;
  margin-bottom: 10px;
  color: #ffd700; /* Gold color for emphasis */
}

.text-content p {
  font-size: 16px;
  line-height: 1.6;
  margin-bottom: 20px;
}

.buy-btn {
  background-color: #ffd700;
  color: #000;
  text-decoration: none;
  padding: 10px 20px;
  font-weight: bold;
  border-radius: 5px;
  transition: background 0.3s;
}

.buy-btn:hover {
  background-color: #e6c200;
}

/* Animation */
@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(50px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

    </style>
</head>
<body>
    <div class="image2-container">
  <div class="image-left">
    <img src="./images/52d353be-ddcd-4bf5-a5d3-72763d22638f.jpg" alt="Yellow Mining Glasses" />
  </div>

  <div class="text-right">
    <div class="text-content">
      <h2>Durability</h2>
      <h4>Built to Last</h4>
      <p>
        Designed to withstand harsh conditions, our glasses provide reliable protection<br>
        and superior visibility for enhanced performance and safety.
      </p>
      <a href="#" class="buy-btn">Buy Now</a>
    </div>
  </div>
</div>

</body>
</html>
