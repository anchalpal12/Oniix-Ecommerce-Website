<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage Orders</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .filters input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .filters button {
      padding: 10px 18px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .filters button:hover {
      background-color: #27ae60;
    }

    .message {
      text-align: center;
      color: #e74c3c;
      font-size: 16px;
      margin-top: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: #2ecc71;
      color: white;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .delete-btn {
      padding: 6px 12px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .delete-btn:hover {
      background-color: #c0392b;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    @media (max-width: 768px) {
      body {
        padding: 16px 12px;
      }

      th, td {
        font-size: 12px;
        white-space: nowrap;
      }

      .filters {
        flex-direction: column;
        align-items: stretch;
      }

      .filters input, .filters button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>Manage Orders</h1>

  <div class="filters">
    <input type="text" id="searchEmail" placeholder="Search by Email" />
    <input type="date" id="startDate" />
    <input type="date" id="endDate" />
    <button onclick="applyFilters()">Apply Filters</button>
    <button onclick="resetFilters()">Reset</button>
  </div>

  <div class="message" id="message"></div>

  <div class="table-wrap">
  <table id="ordersTable" style="display: none;">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Address</th>
        <th>Items</th>
        <th>Total</th>
        <th>Ordered At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="ordersBody"></tbody>
  </table>
  </div>

  <script>
    async function loadOrders(url = '/api/orders/all') {
      const table = document.getElementById('ordersTable');
      const tbody = document.getElementById('ordersBody');
      const message = document.getElementById('message');

      tbody.innerHTML = '';
      message.textContent = 'Loading...';

      try {
        const res = await fetch(url);
        const result = await res.json();

        if (!result.success) throw new Error(result.message);

        if (result.data.length === 0) {
          message.textContent = 'No orders found.';
          table.style.display = 'none';
          return;
        }

        result.data.forEach(order => {
          const row = document.createElement('tr');

          const itemsHTML = Array.isArray(order.cart)
            ? order.cart.map(i => `${i.name} - ₹${parseFloat(i.price).toFixed(2)}`).join('<br>')
            : 'No items';

          row.innerHTML = `
            <td>${order.name}</td>
            <td>${order.email}</td>
            <td>${order.address}</td>
            <td>${itemsHTML}</td>
            <td>₹${parseFloat(order.totalAmount).toFixed(2)}</td>
            <td>${new Date(order.createdAt).toLocaleString()}</td>
            <td><button class="delete-btn" onclick="deleteOrder('${order._id}')">Delete</button></td>
          `;
          tbody.appendChild(row);
        });

        table.style.display = 'table';
        message.textContent = '';
      } catch (err) {
        message.textContent = 'Failed to load orders.';
        table.style.display = 'none';
        console.error(err);
      }
    }

    async function deleteOrder(id) {
      if (!confirm('Are you sure you want to delete this order?')) return;

      try {
        const res = await fetch(`/api/orders/${id}`, { method: 'DELETE' });
        const result = await res.json();

        if (result.success) {
          alert('Order deleted successfully.');
          loadOrders();
        } else {
          alert('Failed to delete order.');
        }
      } catch (err) {
        alert('Error deleting order.');
        console.error(err);
      }
    }

    function applyFilters() {
      const email = document.getElementById('searchEmail').value.trim();
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;

      if (email && start && end) {
        loadOrders(`/api/orders/filter?start=${start}&end=${end}&email=${encodeURIComponent(email)}`);
      } else if (email) {
        loadOrders(`/api/orders/user?email=${encodeURIComponent(email)}`);
      } else if (start && end) {
        loadOrders(`/api/orders/filter?start=${start}&end=${end}`);
      } else {
        alert('Please enter an email or a valid date range.');
      }
    }

    function resetFilters() {
      document.getElementById('searchEmail').value = '';
      document.getElementById('startDate').value = '';
      document.getElementById('endDate').value = '';
      loadOrders();
    }

    // Initial load
    loadOrders();
  </script>
</body>
</html>
