<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage Users</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f6f8;
      color: #333;
    }
    h1 {
      margin-bottom: 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1rem;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 0.75rem;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background-color: #52796f;
      color: white;
    }
    input, select {
      padding: 0.4rem;
      margin-right: 0.5rem;
    }
    button {
      padding: 0.4rem 0.8rem;
      background-color: #52796f;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    button:hover {
      background-color: #3b5d4a;
    }
    form {
      margin-bottom: 1.5rem;
      background: white;
      padding: 1rem;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    /* New styles for back button */
    #backBtn {
      margin-bottom: 1rem;
      background-color: #f0ad4e;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    #backBtn:hover {
      background-color: #ec971f;
    }
  </style>
</head>
<body>
  <button id="backBtn">← Back to Dashboard</button>

  <h1>Manage Users</h1>

  <form id="addUserForm">
    <input type="text" id="name" placeholder="Name" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <select id="role" required>
      <option value="" disabled selected>Select Role</option>
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>
    <button type="submit">Add User</button>
  </form>

  <table aria-label="Users Table" id="usersTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- Users will be populated here -->
    </tbody>
  </table>

  <script>
    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'admin-dashboard.html';
    });

    const API_BASE = '/api/users'; // Adjust if your API route is different

    async function fetchUsers() {
      try {
        const res = await fetch(API_BASE);
        const users = await res.json();
        populateUsersTable(users);
      } catch (err) {
        alert('Error fetching users');
        console.error(err);
      }
    }

    function populateUsersTable(users) {
      const tbody = document.querySelector('#usersTable tbody');
      tbody.innerHTML = '';

      users.forEach(user => {
        const tr = document.createElement('tr');

        tr.innerHTML = `
          <td><input type="text" value="${user.name}" data-id="${user._id}" data-field="name" /></td>
          <td><input type="email" value="${user.email}" data-id="${user._id}" data-field="email" /></td>
          <td>
            <select data-id="${user._id}" data-field="role">
              <option value="user" ${user.role === 'user' ? 'selected' : ''}>User</option>
              <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>
            </select>
          </td>
          <td>
            <button data-id="${user._id}" class="updateBtn">Update</button>
            <button data-id="${user._id}" class="deleteBtn">Delete</button>
          </td>
        `;

        tbody.appendChild(tr);
      });

      document.querySelectorAll('.updateBtn').forEach(btn => {
        btn.addEventListener('click', updateUser);
      });
      document.querySelectorAll('.deleteBtn').forEach(btn => {
        btn.addEventListener('click', deleteUser);
      });
    }

    document.getElementById('addUserForm').addEventListener('submit', async e => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      if (!name || !email || !password || !role) {
        alert('All fields are required');
        return;
      }

      try {
        const res = await fetch(API_BASE + '/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });

        if (!res.ok) {
          const errData = await res.json();
          alert(errData.message || 'Failed to add user');
          return;
        }

        alert('User added successfully!');
        e.target.reset();
        fetchUsers();
      } catch (err) {
        alert('Error adding user');
        console.error(err);
      }
    });

    async function updateUser(e) {
      const id = e.target.dataset.id;
      const row = e.target.closest('tr');
      const name = row.querySelector('input[data-field="name"]').value.trim();
      const email = row.querySelector('input[data-field="email"]').value.trim();
      const role = row.querySelector('select[data-field="role"]').value;

      if (!name || !email || !role) {
        alert('Name, Email, and Role are required');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, role })
        });

        if (!res.ok) {
          const errData = await res.json();
          alert(errData.message || 'Failed to update user');
          return;
        }

        alert('User updated successfully!');
        fetchUsers();
      } catch (err) {
        alert('Error updating user');
        console.error(err);
      }
    }

    async function deleteUser(e) {
      const id = e.target.dataset.id;
      if (!confirm('Are you sure you want to delete this user?')) return;

      try {
        const res = await fetch(`${API_BASE}/${id}`, {
          method: 'DELETE'
        });

        if (!res.ok) {
          const errData = await res.json();
          alert(errData.message || 'Failed to delete user');
          return;
        }

        alert('User deleted successfully!');
        fetchUsers();
      } catch (err) {
        alert('Error deleting user');
        console.error(err);
      }
    }

    fetchUsers();
  </script>
</body>
</html>
