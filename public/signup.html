<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    #signupForm {
      background: #fff;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input, select, button {
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, select:focus {
      border-color: #007bff;
    }

    button {
      background-color: #007bff;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #28a745;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: translateY(30px);
      animation: slidein 0.4s forwards, fadeout 0.5s ease 2.5s forwards;
    }

    .toast.error {
      background: #dc3545;
    }

    @keyframes slidein {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeout {
      to {
        opacity: 0;
        transform: translateY(30px);
      }
    }
  </style>
</head>
<body>

  <form id="signupForm">
    <h2 style="text-align: center; margin: 0;">Sign Up</h2>
    <input type="text" id="name" name="name" placeholder="Name" required />
    <input type="email" id="email" name="email" placeholder="Email" required />
    <input type="password" id="password" name="password" placeholder="Password" required />
    <select name="role" id="role" required>
      <option value="">Select Role</option>
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>
    <button type="submit">Sign Up</button>
  </form>

  <script>
  function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast ${type === 'error' ? 'error' : 'success'}`;
    toast.textContent = message;

    // Basic toast styling if CSS is not provided
    toast.style.position = 'fixed';
    toast.style.bottom = '20px';
    toast.style.right = '20px';
    toast.style.padding = '10px 20px';
    toast.style.borderRadius = '5px';
    toast.style.backgroundColor = type === 'error' ? '#e74c3c' : '#2ecc71';
    toast.style.color = '#fff';
    toast.style.fontWeight = 'bold';
    toast.style.zIndex = '9999';
    toast.style.boxShadow = '0 2px 6px rgba(0, 0, 0, 0.2)';

    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  document.getElementById('signupForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const role = document.getElementById('role').value;

    // Basic client-side validation
    if (!name || !email || !password || !role) {
      showToast('Please fill in all fields', 'error');
      return;
    }

    try {
      const res = await fetch('/api/users/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, role })
      });

      const data = await res.json();  console.log('Signup response:', data);
    

      // Treat both 201 and 500 (with success message) as successful signup
      if (res.status === 201 || (res.status === 500 && data.message.includes('Signup successful'))) {
        showToast('Signup successful! Redirecting...');
        setTimeout(() => {
          window.location.href = './login.html';
        }, 2000);
      } else {
        showToast(data.message || 'Signup failed', 'error');
      }
    } catch (err) {
      console.error('❌ Signup error:', err);
      showToast('Signup failed due to network error', 'error');
    }
  });
</script>

</body>
</html>
