<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter Subscribers</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    th,
    td {
      padding: 12px 15px;
      border-bottom: 1px solid #ccc;
      text-align: left;
    }

    th {
      background: #000;
      color: #fff;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px;
    }
  </style>
</head>

<body>
  <h1>Newsletter Subscribers</h1>
  <table id="newsletterTable">
    <thead>
      <tr>
        <th>Email</th>
        <th>Subscribed On</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="2" class="empty">Loading...</td>
      </tr>
    </tbody>
  </table>
  <div id="errorMessage" class="error"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const token = localStorage.getItem('token');
      const tbody = document.querySelector('#newsletterTable tbody');
      const errorMessage = document.getElementById('errorMessage');

      if (!token) {
        errorMessage.textContent = 'Unauthorized access. Please login as admin.';
        tbody.innerHTML = '<tr><td colspan="2" class="empty">No access token found.</td></tr>';
        return;
      }

      fetch('http://localhost:5000/api/newsletter-subscribers', {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      })
        .then(response => {
          if (!response.ok) {
            if (response.status === 401 || response.status === 403) {
              throw new Error('Unauthorized. Please login again.');
            } else {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
          }
          return response.json();
        })
        .then(data => {
          tbody.innerHTML = '';

          if (!Array.isArray(data) || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2" class="empty">No subscribers found.</td></tr>`;
            return;
          }

          data.forEach(subscriber => {
            const subscribedAt = subscriber.subscribedAt ? new Date(subscriber.subscribedAt) : null;
            const formattedDate = subscribedAt && !isNaN(subscribedAt)
              ? subscribedAt.toLocaleString()
              : 'N/A';

            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${subscriber.email}</td>
              <td>${formattedDate}</td>
            `;
            tbody.appendChild(row);
          });
        })
        .catch(error => {
          console.error('❌ Error fetching newsletter data:', error);
          errorMessage.textContent = error.message || 'Failed to load subscribers.';
          tbody.innerHTML = `<tr><td colspan="2" class="empty">Error loading data.</td></tr>`;
        });
    });
  </script>
</body>

</html>
